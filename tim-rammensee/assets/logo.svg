<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 104" fill="none" role="img" aria-label="Tim Rammensee — Photography & Film">
  <!-- Horizontale Logo-Sperre: TR-Monogramm (T über R, Linie) + Wortmarke. R + Linie in Silber. -->
  <g>
    <line x1="18" y1="18" x2="18" y2="86" stroke="#cfcfcf" stroke-width="3" stroke-linecap="round"/>
    <text x="58" y="46" text-anchor="middle" fill="currentColor" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">T</text>
    <text x="58" y="90" text-anchor="middle" fill="#cfcfcf" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="800">R</text>
  </g>
  <g>
    <text x="112" y="52" font-family="'Fraunces', Georgia, serif" font-size="38" font-weight="600" letter-spacing="0.5" fill="currentColor">Tim Rammensee</text>
    <text x="114" y="73" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="400" letter-spacing="6" fill="#cfcfcf">PHOTOGRAPHY · FILM</text>
  </g>
</svg>
