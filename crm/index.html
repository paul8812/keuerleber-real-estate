<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#080808">
<title>Keuerleber CRM</title>
<link rel="icon" href="../favicon-32.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" hidden>
  <form class="loginbox" autocomplete="on">
    <div class="logo"><span class="diamond"><span>K</span></span><div><b>KEUERLEBER</b><small>CRM</small></div></div>
    <input name="email" type="email" placeholder="E-Mail" required autocomplete="username">
    <input name="password" type="password" placeholder="Passwort" required autocomplete="current-password">
    <button class="btn primary">Anmelden</button><p class="err"></p>
    <a href="#" data-local class="muted small">Cloud trennen / lokal arbeiten</a>
  </form>
</div>
<div id="app" hidden>
  <aside id="side"><div class="brand"><span class="diamond"><span>K</span></span><div><b>Keuerleber</b><small>CRM</small></div></div><nav id="nav"></nav><div class="foot"><span id="mode"></span></div></aside>
  <div id="content">
    <header class="top"><button id="burger" aria-label="Menü">☰</button>
      <div class="search"><input id="gsearch" type="search" placeholder="Alles durchsuchen …  (Strg/⌘ + K)" autocomplete="off"><div id="gresults" hidden></div></div>
      <button id="quick" class="btn primary">+ Neu</button></header>
    <main id="main"></main>
  </div>
</div>
<div id="modal-root"></div><div id="toast-root"></div>
<noscript>Bitte JavaScript aktivieren.</noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
